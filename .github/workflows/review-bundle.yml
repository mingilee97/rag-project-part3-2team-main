name: Public review bundle
on:
  push:
    branches: ['review/team-dashboard-model-versions-20261009']
  pull_request:
    paths: ['versions/**', 'dashboard/**', 'candidates/**', 'evaluation/**', '.github/workflows/review-bundle.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -B evaluation/test_cpu_service.py
      - run: python -B evaluation/test_cleaning_adapter.py
      - run: python -B evaluation/test_retrieval_protocol.py
      - run: python -B evaluation/test_vm_service.py
      - run: python -B evaluation/verify_public_bundle.py
      - run: node dashboard/test-example.mjs
      - run: git diff --check
